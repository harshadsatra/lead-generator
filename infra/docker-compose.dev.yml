# Local development only. Production stack lives in docker-compose.yml (Phase 1a §7).
name: lead-engine-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads_dev
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d leads"]
      interval: 5s
      retries: 10

  directus:
    image: directus/directus:12.4.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: dev-key-not-secret
      SECRET: dev-secret-not-secret
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: leads
      DB_USER: leads
      DB_PASSWORD: leads_dev
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin_dev}
      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus:/directus/snapshots

volumes:
  pg_data:
  directus_uploads:
